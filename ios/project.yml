# Proiectul Xcode se generează din fișierul ăsta cu XcodeGen (pe Mac-ul din GitHub Actions).
# Fișierele web (index.html, core.js, journal.js) se copiază în Merita/web/ înainte de build.
name: Merita
options:
  bundleIdPrefix: ro.merita
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Merita:
    type: application
    platform: iOS
    sources:
      - path: Merita
        excludes:
          - "web/**"
          - "Info.plist"
      - path: Merita/web
        type: folder
        buildPhase: resources
    info:
      path: Merita/Info.plist
      properties:
        CFBundleDisplayName: "Merită?"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.merita.iphone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
